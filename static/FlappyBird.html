<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            background: #1a2a1f;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 3px solid #2c3e2f;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
<!-- одиночный режим flappy bird -->
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const W = 400, H = 600;

        // === НАСТРОЙКИ ИГРЫ (УМЕНЬШЕННОЕ ПРИТЯЖЕНИЕ) ===
        const GRAVITY = 0.12;          // уменьшенное притяжение (было 0.18)
        const JUMP_POWER = -3.8;       // хороший прыжок
        const PIPE_SPEED = 1.6;        // комфортная скорость труб
        const PIPE_SPACING = 260;       // расстояние между трубами
        const PIPE_WIDTH = 52;
        const PIPE_GAP = 165;           // широкий проход
        
        const WIN_SECONDS = 60;          
        let gameStartTime = 0;
        
        const BIRD_RADIUS = 13;
        const BIRD_X = 80;
        let birdY = H / 2;
        let birdVelocity = 0;
        let wingAngle = 0;

        let pipes = [];
        let score = 0;
        let gameState = 'menu';
        let buttons = [];

        function notifyWin() {
            if (window.onGameWin) {
                window.onGameWin(10);
            }
        }

        function generatePipe(startX) {
            const minGapY = 70;
            const maxGapY = H - PIPE_GAP - 70;
            const gapY = Math.random() * (maxGapY - minGapY) + minGapY;
            return { x: startX, gapY: gapY, passed: false };
        }

        function fullReset() {
            birdY = H / 2;
            birdVelocity = 0;
            score = 0;
            pipes = [];
            let startX = W;
            for(let i = 0; i < 3; i++) {
                pipes.push(generatePipe(startX));
                startX += PIPE_SPACING;
            }
        }

        function startFromMenu() {
            gameState = 'waiting';
            fullReset();
            draw();
        }

        function firstJump() {
            if(gameState === 'waiting') {
                gameState = 'playing';
                gameStartTime = Date.now();
                birdVelocity = JUMP_POWER;
                wingAngle = -0.8;
            }
        }

        function playingJump() {
            if(gameState === 'playing') {
                birdVelocity = JUMP_POWER;
                wingAngle = -0.8;
            }
        }

        function restartGame() {
            gameState = 'waiting';
            fullReset();
            birdVelocity = 0;
            draw();
        }

        function updateGame() {
            if(gameState !== 'playing') return;

            const elapsed = (Date.now() - gameStartTime) / 1000;
            if(elapsed >= WIN_SECONDS) {
                score = 10;
                gameState = 'win';
                notifyWin();
                return;
            }

            birdVelocity += GRAVITY;
            birdY += birdVelocity;
            
            wingAngle += 0.15;
            if(wingAngle > 0.5) wingAngle = 0.5;
            if(wingAngle < -0.8) wingAngle = -0.8;

            if(birdY + BIRD_RADIUS >= H || birdY - BIRD_RADIUS <= 0) {
                score = 0;
                gameState = 'gameover';
                return;
            }

            for(let i = 0; i < pipes.length; i++) {
                const p = pipes[i];
                p.x -= PIPE_SPEED;

                if(!p.passed && p.x + PIPE_WIDTH < BIRD_X - BIRD_RADIUS) {
                    p.passed = true;
                }

                const birdLeft = BIRD_X - BIRD_RADIUS;
                const birdRight = BIRD_X + BIRD_RADIUS;
                const birdTop = birdY - BIRD_RADIUS;
                const birdBottom = birdY + BIRD_RADIUS;
                const pipeLeft = p.x;
                const pipeRight = p.x + PIPE_WIDTH;
                const topPipeBottom = p.gapY;
                const bottomPipeTop = p.gapY + PIPE_GAP;

                if(birdRight > pipeLeft && birdLeft < pipeRight) {
                    if(birdTop < topPipeBottom || birdBottom > bottomPipeTop) {
                        score = 0;
                        gameState = 'gameover';
                        return;
                    }
                }
            }

            if(pipes.length > 0 && pipes[0].x + PIPE_WIDTH < 0) {
                pipes.shift();
                const lastPipe = pipes[pipes.length-1];
                const newX = lastPipe.x + PIPE_SPACING;
                pipes.push(generatePipe(newX));
            }
        }

        function drawBird() {
            ctx.save();
            ctx.fillStyle = "#FFB347";
            ctx.shadowBlur = 3;
            ctx.beginPath();
            ctx.arc(BIRD_X, birdY, BIRD_RADIUS, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#FFDEAD";
            ctx.beginPath();
            ctx.ellipse(BIRD_X-3, birdY+1, 5, 8, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#E8952D";
            ctx.beginPath();
            ctx.ellipse(BIRD_X-6, birdY+2, 8, 5.5, wingAngle, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#D4791A";
            ctx.beginPath();
            ctx.moveTo(BIRD_X-14, birdY);
            ctx.lineTo(BIRD_X-21, birdY-4);
            ctx.lineTo(BIRD_X-18, birdY+3);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(BIRD_X-13, birdY+2);
            ctx.lineTo(BIRD_X-20, birdY+6);
            ctx.lineTo(BIRD_X-17, birdY+1);
            ctx.fill();
            ctx.fillStyle = "#FF8C42";
            ctx.beginPath();
            ctx.moveTo(BIRD_X-4, birdY-14);
            ctx.lineTo(BIRD_X-9, birdY-20);
            ctx.lineTo(BIRD_X+1, birdY-17);
            ctx.fill();
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.arc(BIRD_X+5, birdY-4, 4.2, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#1E2A2E";
            ctx.beginPath();
            ctx.arc(BIRD_X+6, birdY-4.5, 2.2, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.arc(BIRD_X+7, birdY-5.5, 0.9, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#E85D5D";
            ctx.beginPath();
            ctx.arc(BIRD_X-4, birdY+3, 2.8, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#E67E22";
            ctx.beginPath();
            ctx.moveTo(BIRD_X+11, birdY-2);
            ctx.lineTo(BIRD_X+17, birdY-1);
            ctx.lineTo(BIRD_X+11, birdY+2);
            ctx.fill();
            ctx.restore();
        }

        function checkButtonClick(mouseX, mouseY) {
            for(let btn of buttons) {
                if(mouseX >= btn.x && mouseX <= btn.x + btn.w && mouseY >= btn.y && mouseY <= btn.y + btn.h) {
                    btn.action();
                    return true;
                }
            }
            return false;
        }

        function drawRoundedButton(x, y, w, h, text, color) {
            const radius = 12;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 22px 'Arial'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, x + w/2, y + h/2);
        }

        function drawCenteredText(text, y, fontSize, color, isBold = true) {
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = (isBold ? "bold " : "") + fontSize + " 'Arial'";
            ctx.fillStyle = color;
            ctx.fillText(text, W/2, y);
        }

        function draw() {
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, W, H);
            
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath();
            ctx.ellipse(50, 70, 30, 20, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(320, 120, 40, 25, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(180, 500, 35, 22, 0, 0, Math.PI*2);
            ctx.fill();
            
            if(gameState !== 'menu') {
                ctx.fillStyle = "#2d6a2f";
                for(let p of pipes) {
                    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.gapY);
                    ctx.fillRect(p.x, p.gapY + PIPE_GAP, PIPE_WIDTH, H - (p.gapY + PIPE_GAP));
                    ctx.fillStyle = "#1e4a1e";
                    ctx.fillRect(p.x-3, p.gapY-22, PIPE_WIDTH+6, 22);
                    ctx.fillRect(p.x-3, p.gapY+PIPE_GAP, PIPE_WIDTH+6, 22);
                    ctx.fillStyle = "#2d6a2f";
                }
            }
            
            drawBird();
            
            if(gameState === 'playing') {
                const elapsed = (Date.now() - gameStartTime) / 1000;
                const remaining = Math.max(0, WIN_SECONDS - elapsed);
                drawCenteredText(Math.ceil(remaining), 70, "48px", "#FFFFFF", true);
            }
            
            if(gameState === 'menu') {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, W, H);
                drawBird();
                const btnX = W/2 - 90;
                const btnY = H/2 + 40;
                drawRoundedButton(btnX, btnY, 180, 50, "СТАРТ", "#4CAF50");
                buttons = [{ x: btnX, y: btnY, w: 180, h: 50, action: startFromMenu }];
                drawCenteredText("FLAPPY BIRD", H/2 - 50, "24px", "#FFD966", true);
                drawCenteredText("нажми СТАРТ", H/2 + 120, "14px", "#DDD", false);
            }
            
            if(gameState === 'waiting') {
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(0, 0, W, H);
                drawCenteredText("НАЖМИ ПРОБЕЛ", H/2, "20px", "#FFF", true);
                drawCenteredText("или клик мышкой", H/2 + 35, "14px", "#CCC", false);
            }
            
            if(gameState === 'gameover') {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, W, H);
                drawCenteredText("GAME OVER", H/2 - 60, "30px", "#E85D5D", true);
                const restartX = W/2 - 70;
                const restartY = H/2 + 20;
                drawRoundedButton(restartX, restartY, 140, 50, "ЗАНОВО", "#4CAF50");
                drawCenteredText("0 очков", H/2 - 15, "18px", "#FFD966", false);
                buttons = [{ x: restartX, y: restartY, w: 140, h: 50, action: restartGame }];
            }
            
            if(gameState === 'win') {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, W, H);
                drawCenteredText("ПОБЕДА!", H/2 - 60, "32px", "#FFD966", true);
                drawCenteredText("+10 очков", H/2 - 15, "24px", "#FFAA00", true);
                const restartX = W/2 - 70;
                const restartY = H/2 + 40;
                drawRoundedButton(restartX, restartY, 140, 50, "ЗАНОВО", "#4CAF50");
                buttons = [{ x: restartX, y: restartY, w: 140, h: 50, action: restartGame }];
            }
            
            ctx.textAlign = "left";
        }

        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseX, mouseY;
            if(e.touches) {
                mouseX = (e.touches[0].clientX - rect.left) * scaleX;
                mouseY = (e.touches[0].clientY - rect.top) * scaleY;
                e.preventDefault();
            } else {
                mouseX = (e.clientX - rect.left) * scaleX;
                mouseY = (e.clientY - rect.top) * scaleY;
            }
            if(checkButtonClick(mouseX, mouseY)) return;
            if(gameState === 'waiting') firstJump();
            else if(gameState === 'playing') playingJump();
        }
        
        function handleKeydown(e) {
            if(e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if(gameState === 'waiting') firstJump();
                else if(gameState === 'playing') playingJump();
            }
        }

        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', handleCanvasClick);
        window.addEventListener('keydown', handleKeydown);

        fullReset();
        gameLoop();
    })();
</script>
</body>
</html>
