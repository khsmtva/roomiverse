<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tower Stack</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #080612;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .game-screen {
      width: min(100%, 440px);
      padding: 20px 20px 24px;
      background: #0f0c1f;
      border: 2px solid #764ba2;
      border-radius: 12px;
      box-shadow:
        0 0 0 1px rgba(118, 75, 162, 0.35),
        0 24px 48px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #score {
      font-size: 32px;
      font-weight: bold;
      color: #4ecdc4;
      line-height: 1;
      margin: 0 0 16px;
      min-height: 1em;
    }
    #game {
      display: block;
      margin: 0;
      background: #16213e;
      border: 2px solid #764ba2;
      border-radius: 4px;
      touch-action: none;
      cursor: pointer;
      vertical-align: top;
    }
  </style>
</head>
<body>
  <!-- локальная версия мини игры tower -->
  <div class="game-screen">
    <div id="score">0</div>
    <canvas id="game" width="400" height="400" aria-label="Игровое поле"></canvas>
  </div>
  <script>
(function () {
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");

  var BLUE = "#667eea";
  var CYAN = "#4ecdc4";
  var RED = "#ff6b6b";
  var CANVAS_BG = "#16213e";

  var fieldWidth = 400;
  var blockHeight = 30;
  var blocks = [];
  var blockWidth = 160;
  var currentX = 0;
  var moveRight = true;
  var score = 0;
  var gameState = 'menu';
  var scrollY = 0;
  var scrollMargin = 75;
  var currentY = 340;
  var defeatNotified = false;

  var buttons = [];

  var colors = [BLUE, CYAN, "#2ecc71", "#f39c12", "#9b59b6"];

  function notifyParentDefeat() {
    if (defeatNotified) return;
    defeatNotified = true;
    try {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'tower:pvp_defeat' }, window.location.origin);
      }
    } catch (e) {}
  }

  function randChoice(arr) {
    return arr[(Math.random() * arr.length) | 0];
  }

  function resetState() {
    blocks = [];
    blockWidth = 160;
    currentX = 0;
    moveRight = true;
    score = 0;
    scrollY = 0;
    defeatNotified = false;
    blocks.push({
      x: (400 - 160) >> 1,
      y: 370,
      w: 160,
      color: BLUE
    });
    currentY = 340;
    scoreEl.textContent = "0";
  }

  function startGame() {
    resetState();
    gameState = 'playing';
  }

  function restartFromGameOver() {
    resetState();
    gameState = 'playing';
  }

  function restartTowerGame() {
    resetState();
    gameState = 'playing';
    buttons = [];
    draw();
  }

  window.restartTowerGame = restartTowerGame;

  window.addEventListener('message', function (e) {
    if (e.origin !== window.location.origin) return;
    if (!e.data || e.data.type !== 'tower:restart') return;
    restartTowerGame();
  });

  function updateCameraScroll() {
    var minY = blocks.reduce(function (m, b) {
      return Math.min(m, b.y);
    }, blocks[0].y);
    if (gameState === 'playing') minY = Math.min(minY, currentY);
    if (minY < scrollMargin) scrollY = scrollMargin - minY;
    else scrollY = 0;
  }

  function drawRoundedButton(x, y, w, h, text, color) {
    var radius = 12;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 22px 'Segoe UI', system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x + w/2, y + h/2);
  }

  function drawCenteredText(text, y, fontSize, color, isBold) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = (isBold ? "bold " : "") + fontSize + " 'Segoe UI', system-ui";
    ctx.fillStyle = color;
    ctx.fillText(text, canvas.width/2, y);
  }

  function draw() {
    updateCameraScroll();
    var sy = scrollY;

    ctx.fillStyle = CANVAS_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    blocks.forEach(function (b) {
      var y1 = b.y + sy;
      ctx.fillStyle = b.color;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.fillRect(b.x, y1, b.w, blockHeight);
      ctx.strokeRect(b.x, y1, b.w, blockHeight);
    });

    if (gameState === 'playing') {
      var cy1 = currentY + sy;
      ctx.fillStyle = RED;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.fillRect(currentX, cy1, blockWidth, blockHeight);
      ctx.strokeRect(currentX, cy1, blockWidth, blockHeight);
    }

    if (gameState === 'menu') {
      ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenteredText("TOWER STACK", canvas.height/2 - 70, "28px", "#FFD966", true);
      drawCenteredText("Собирай башню", canvas.height/2 - 35, "14px", "#CCC", false);

      var btnX = canvas.width/2 - 90;
      var btnY = canvas.height/2 + 20;
      drawRoundedButton(btnX, btnY, 180, 50, "СТАРТ", "#4CAF50");
      buttons = [{ x: btnX, y: btnY, w: 180, h: 50, action: startGame }];

      drawCenteredText("нажми СТАРТ", canvas.height/2 + 90, "12px", "#AAA", false);
    }

    if (gameState === 'gameover') {
      ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenteredText("GAME OVER", canvas.height/2 - 70, "28px", "#E85D5D", true);
      drawCenteredText("Счёт: " + score, canvas.height/2 - 30, "18px", "#FFD966", true);

      var restartX = canvas.width/2 - 70;
      var restartY = canvas.height/2 + 20;
      drawRoundedButton(restartX, restartY, 140, 50, "ЗАНОВО", "#4CAF50");
      buttons = [{ x: restartX, y: restartY, w: 140, h: 50, action: restartTowerGame }];
    }
  }

  function checkButtonClick(mouseX, mouseY) {
    for (var i = 0; i < buttons.length; i++) {
      var btn = buttons[i];
      if (mouseX >= btn.x && mouseX <= btn.x + btn.w && mouseY >= btn.y && mouseY <= btn.y + btn.h) {
        btn.action();
        buttons = [];
        draw();
        return true;
      }
    }
    return false;
  }

  var lastTs = 0;
  var acc = 0;
  var STEP_MS = 30;

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    acc += ts - lastTs;
    lastTs = ts;
    while (acc >= STEP_MS) {
      acc -= STEP_MS;
      if (gameState === 'playing') {
        var speed = 6;
        if (moveRight) {
          currentX += speed;
          if (currentX + blockWidth >= fieldWidth) {
            currentX = fieldWidth - blockWidth;
            moveRight = false;
          }
        } else {
          currentX -= speed;
          if (currentX <= 0) {
            currentX = 0;
            moveRight = true;
          }
        }
      }
    }
    draw();
    requestAnimationFrame(tick);
  }

  function place() {
    if (gameState !== 'playing') return;

    var last = blocks[blocks.length - 1];
    var left = Math.max(currentX, last.x);
    var right = Math.min(currentX + blockWidth, last.x + last.w);

    if (right <= left) {
      gameState = 'gameover';
      notifyParentDefeat();
      draw();
      return;
    }

    var newW = right - left;
    var newX = left;
    var newY = last.y - blockHeight;
    score += newW;
    scoreEl.textContent = String(score);

    blocks.push({
      x: newX,
      y: newY,
      w: newW,
      color: randChoice(colors)
    });

    blockWidth = newW;
    currentX = Math.random() < 0.5 ? 0 : fieldWidth - newW;
    moveRight = currentX > 0;
    currentY = newY;
  }

  function handleCanvasClick(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var mouseX, mouseY;

    if (e.touches) {
      mouseX = (e.touches[0].clientX - rect.left) * scaleX;
      mouseY = (e.touches[0].clientY - rect.top) * scaleY;
      e.preventDefault();
    } else {
      mouseX = (e.clientX - rect.left) * scaleX;
      mouseY = (e.clientY - rect.top) * scaleY;
    }

    if (checkButtonClick(mouseX, mouseY)) return;

    if (gameState === 'menu') return;
    if (gameState === 'gameover') return;

    place();
  }

  function handleKeydown(e) {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (gameState === 'menu') return;
      if (gameState === 'gameover') return;
      place();
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      if (gameState === 'menu' || gameState === 'gameover' || gameState === 'playing') {
        restartTowerGame();
      }
    }
  }

  canvas.addEventListener('click', handleCanvasClick);
  canvas.addEventListener('touchstart', handleCanvasClick);
  window.addEventListener('keydown', handleKeydown);

  resetState();
  if (/[?&]autostart=1(?:&|$)/.test(window.location.search)) {
    startGame();
  }
  requestAnimationFrame(tick);
})();
  </script>
</body>
</html>
