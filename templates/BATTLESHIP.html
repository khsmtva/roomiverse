<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOMIVERSE - Морской бой</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        .bs-grid { display:grid; grid-template-columns:repeat(11,32px); gap:3px; }
        .bs-cell { width:32px; height:32px; border:none; border-radius:6px; background:#1a1a3a; color:#a0a0c0; cursor:pointer; font-size:14px; }
        .bs-cell.ship { background:#2a3a6a; }
        .bs-cell.hit { background:#d9534f; color:#fff; }
        .bs-cell.miss { background:#666; color:#fff; }
        .bs-panel { background:rgba(255,255,255,.05); border-radius:12px; padding:12px; }
        .bs-axis {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
            font-weight: 700;
            user-select: none;
        }
    </style>
</head>
<body>
    <!-- экран матча морского боя -->
    <div class="top-line"></div>
    <div class="container">
        <div class="header-with-lines" style="width:100%; display:block;">
            <div class="game-topbar">
                <h1 class="logo" style="margin:0;">ROOMIVERSE</h1>
                <div class="game-topbar-spacer"></div>
                <div class="game-room-controls">
                    <span class="game-room-code" id="roomCodeText">{{ room_code }}</span>
                    <button class="rv-btn" onclick="copyRoomCode()">Копировать</button>
                </div>
                <div class="game-player-wrap">
                    <span class="game-player-label">Ник:</span>
                    <span class="game-player-name" id="myNameLabel">Игрок</span>
                </div>
                <a href="/lobby?code={{ room_code }}" class="rv-btn game-exit-btn">Выход</a>
            </div>
        </div>
        <h2 class="game-page-title">Морской бой</h2>
        <p id="statusText" class="game-page-desc">Загрузка...</p>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; max-width:980px; margin:0 auto;">
            <div class="bs-panel">
                <h3>Ваше поле</h3>
                <div id="yourBoard" class="bs-grid"></div>
            </div>
            <div class="bs-panel">
                <h3>Поле выстрелов</h3>
                <div id="shotsBoard" class="bs-grid"></div>
            </div>
        </div>

        <div style="display:flex; justify-content:center; gap:10px; margin-top:12px;">
            <input id="coordInput" class="chat-input" style="max-width:140px;" placeholder="А5">
            <button class="chat-send-btn" onclick="shootByInput()">Огонь</button>
        </div>
        <div style="display:flex; justify-content:center; gap:10px; margin-top:10px;">
            <button class="rv-btn" onclick="restartGame()">Начать заново</button>
            <button class="rv-btn" onclick="surrender()">Сдаться</button>
        </div>

        <div class="chat-section" style="height:300px; max-width:980px; width:100%; margin:16px auto 0;">
            <h2>Чат</h2>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="Введите сообщение..." onkeypress="checkEnter(event)">
                <button class="chat-send-btn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        const roomCode = "{{ room_code }}".trim().toUpperCase();
        const playerName = (() => {
            let n = sessionStorage.getItem('playerName');
            if (n && String(n).trim()) return String(n).trim().slice(0, 20);
            n = localStorage.getItem('playerName');
            return (n && String(n).trim()) ? String(n).trim().slice(0, 20) : 'Игрок';
        })();
        const socket = io();
        let sid = null;
        let state = null;
        const clientId = (() => {
            let id = sessionStorage.getItem('roomiverseClientId');
            if (!id) {
                id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('cid-' + Math.random().toString(36).slice(2));
                sessionStorage.setItem('roomiverseClientId', id);
            }
            return id;
        })();
        document.getElementById('myNameLabel').textContent = playerName;

        socket.on('connect', () => {
            sid = socket.id;
            socket.emit('join_room', { room_code: roomCode, name: playerName, client_id: clientId });
            loadState();
        });
        socket.on('chat_history', (payload) => {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            (payload?.messages || []).forEach((m) => appendChatMessage(m.sender, m.message));
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        function loadState() {
            fetch(`/api/game_state/${roomCode}?sid=${encodeURIComponent(sid || '')}`)
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('statusText').textContent = data.error;
                        return;
                    }
                    state = data;
                    render();
                });
        }

        function render() {
            if (!state || !state.your_board || !state.shots_board) return;
            document.getElementById('statusText').textContent =
                state.game_over ? `Победил: ${state.winner?.name || '—'}` :
                `Ход игрока: ${state.current_player?.name || '—'}`;
            drawBoard('yourBoard', state.your_board, false);
            drawBoard('shotsBoard', state.shots_board, true);
        }

        function drawBoard(id, board, clickable) {
            const root = document.getElementById(id);
            root.innerHTML = '';
            const letters = (state.letters || 'АБВГДЕЖЗИК');
            const corner = document.createElement('div');
            corner.className = 'bs-axis';
            root.appendChild(corner);
            for (let c = 0; c < 10; c++) {
                const topLabel = document.createElement('div');
                topLabel.className = 'bs-axis';
                topLabel.textContent = letters[c] || '';
                root.appendChild(topLabel);
            }
            for (let r = 0; r < 10; r++) {
                const leftLabel = document.createElement('div');
                leftLabel.className = 'bs-axis';
                leftLabel.textContent = String(r + 1);
                root.appendChild(leftLabel);
                for (let c = 0; c < 10; c++) {
                    const v = board[r][c];
                    const b = document.createElement('button');
                    b.className = 'bs-cell';
                    if (v === 'S') b.classList.add('ship');
                    if (v === 'X') { b.classList.add('hit'); b.textContent = 'X'; }
                    if (v === 'M') { b.classList.add('miss'); b.textContent = '•'; }
                    if (clickable && !state.game_over) {
                        b.onclick = () => shootCoord(r, c);
                    } else {
                        b.disabled = true;
                    }
                    root.appendChild(b);
                }
            }
        }

        function toCoord(r, c) {
            const letters = (state.letters || 'АБВГДЕЖЗИК');
            return `${letters[c]}${r + 1}`;
        }

        function shootCoord(r, c) {
            shoot(toCoord(r, c));
        }

        function shootByInput() {
            const coord = document.getElementById('coordInput').value.trim();
            if (!coord) return;
            shoot(coord);
        }

        function shoot(coord) {
            fetch('/api/battleship/shoot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ room_code: roomCode, sid, coord })
            }).then(r => r.json()).then(data => {
                if (!data.success) { alert(data.message || 'Ошибка'); return; }
                state = data.state || state;
                if (data.game_over) {
                    alert(data.message || 'Игра окончена');
                }
                render();
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            socket.emit('send_message', { room_code: roomCode, message });
            input.value = '';
        }
        function checkEnter(event) { if (event.key === 'Enter') sendMessage(); }
        socket.on('new_message', (data) => {
            appendChatMessage(data.sender, data.message);
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
        function appendChatMessage(sender, message) {
            const chatMessages = document.getElementById('chatMessages');
            const timeStr = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            chatMessages.innerHTML += `<div class="chat-message"><span class="message-sender">${sender}</span><span class="message-time">${timeStr}</span><div>${message}</div></div>`;
        }
        function copyRoomCode() { navigator.clipboard.writeText(roomCode); }
        function restartGame() { window.location.reload(); }
        function surrender() {
            if (!confirm('Сдаться и выйти в лобби?')) return;
            window.location.href = '/lobby?code=' + encodeURIComponent(roomCode);
        }

        setInterval(() => { if (socket.connected) loadState(); }, 2000);
    </script>
</body>
</html>
